services:
  - type: web
    name: whatsapp-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GREEN_API_URL
        sync: false
      - key: GREEN_API_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: BOT_OWNER_PHONE
        sync: false
      - key: BOT_TIMEZONE
        value: Asia/Jerusalem
      - key: DATABASE_PATH
        value: data/conversations.db
      - key: MAX_HISTORY
        value: "30"
